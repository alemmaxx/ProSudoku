name: Build ProSudoku APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Sediakan fail web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Cipta projek Android
        run: npx cap add android

      - name: Jana ikon app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#140f2e' --splashBackgroundColor '#140f2e' || echo "Ikon dilangkau"

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Namakan semula APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProSudoku.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProSudoku-APK
          path: ProSudoku.apk
