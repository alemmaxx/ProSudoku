<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProSudoku</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#f4f2ff;text-align:center;
background:radial-gradient(900px 600px at 10% -10%,#3b2a8a,transparent 60%),radial-gradient(700px 600px at 110% 110%,#0e4a6b,transparent 60%),linear-gradient(160deg,#140f2e,#231a52 50%,#0b1a3a)}
.box{max-width:360px;width:100%;padding:28px 22px;border-radius:28px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.ic{font-size:64px;margin-bottom:10px}
h1{font-size:22px;margin-bottom:8px}
p{color:#a9a3d6;font-size:14px;line-height:1.5;margin-bottom:20px}
button{width:100%;padding:15px;border:none;border-radius:18px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#22d3ee,#8b5cf6 55%,#ec4899)}
small{display:block;margin-top:14px;color:#a9a3d6;font-size:11px;letter-spacing:2px}
</style></head><body>
<div class="box"><div class="ic">📡</div>
<h1>Tiada Internet</h1>
<p>ProSudoku perlukan internet untuk kali pertama dibuka. Selepas itu, mod solo boleh dimain tanpa internet.<br><br><i>No internet. ProSudoku needs internet the first time it opens.</i></p>
<button onclick="location.href='https://alemmaxx.github.io/ProSudoku/'">🔄 Cuba Lagi / Retry</button>
<small>PROSUDOKU BY PROKUIZ</small></div>
<script>addEventListener('online',()=>location.href='https://alemmaxx.github.io/ProSudoku/')</script>
</body></html>
